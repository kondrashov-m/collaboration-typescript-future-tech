<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Страница не найдена | Future Tech</title>
    <link rel="stylesheet" href="styles/main.css">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <style>
        .error-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .error-container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 100%;
        }
        
        .error-code {
            font-size: 120px;
            font-weight: 900;
            color: #667eea;
            line-height: 1;
            margin: 0 0 20px;
            text-shadow: 3px 3px 0 #764ba2;
        }
        
        .error-title {
            font-size: 28px;
            color: #333;
            margin-bottom: 20px;
            font-weight: 700;
        }
        
        .error-description {
            color: #666;
            line-height: 1.6;
            margin-bottom: 30px;
            font-size: 16px;
        }
        
        .home-button {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 32px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            transition: transform 0.3s, box-shadow 0.3s;
            border: none;
            cursor: pointer;
        }
        
        .home-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }
        
        .error-illustration {
            width: 200px;
            height: 200px;
            margin: 0 auto 30px;
            background: #f0f4ff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        
        .error-illustration::before {
            content: "404";
            font-size: 80px;
            font-weight: 900;
            color: #e0e7ff;
            position: absolute;
        }
        
        @media (max-width: 768px) {
            .error-container {
                padding: 30px 20px;
            }
            
            .error-code {
                font-size: 80px;
            }
            
            .error-title {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>
    <div class="error-page">
        <div class="error-container">
            <div class="error-illustration"></div>
            <h1 class="error-code">404</h1>
            <h2 class="error-title">Ой! Страница не найдена</h2>
            <p class="error-description">
                Похоже, вы пытаетесь найти страницу, которая не существует или была перемещена. 
                Возможно, вы ошиблись в адресе или ссылка устарела.
            </p>
            <a href="/" class="home-button">Вернуться на главную</a>
        </div>
    </div>
    
    <script>
        // Добавляем анимацию при загрузке
        document.addEventListener('DOMContentLoaded', function() {
            const container = document.querySelector('.error-container');
            container.style.opacity = '0';
            container.style.transform = 'translateY(20px)';
            
            setTimeout(() => {
                container.style.transition = 'opacity 0.5s ease, transform 0.5s ease';
                container.style.opacity = '1';
                container.style.transform = 'translateY(0)';
            }, 100);
            
            // Статистика для аналитики (опционально)
            console.log('404 Page accessed from:', document.referrer || 'direct visit');
        });
    </script>
</body>
</html>
