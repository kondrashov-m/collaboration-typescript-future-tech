[build]
  publish = "dist"
  command = "npm run build"

# Явные правила для многостраничного сайта
[[redirects]]
  from = "/blog"
  to = "/blog.html"
  status = 200
  force = true

[[redirects]]
  from = "/news"
  to = "/news.html"
  status = 200
  force = true

# Добавьте правила для всех других страниц: /podcasts, /resources, /contacts, /select

# Правило для главной страницы (опционально, но желательно)
[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200
  force = true

# Обработка 404-х ошибок для несуществующих файлов
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 404